[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-dataset-pytorch"
version = "0.1.0"
description = "Experimental lightweight data-loading library for PyTorch"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Pascal Nague" }
]

dependencies = [
    "torch",
    "torchvision",
    "pyarrow",
    "Pillow",
]

keywords = [
    "pytorch",
    "dataloader",
    "deep-learning",
    "parquet",
    "machine-learning",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/MrNague/BA-Project---Minimal-Dependency-Dataset-Library-for-PyTorch"
Issues = "https://github.com/MrNague/BA-Project---Minimal-Dependency-Dataset-Library-for-PyTorch/issues"

[tool.setuptools.packages.find]
include = ["minimal_dataset*"]
